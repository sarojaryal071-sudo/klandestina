<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found – Klandestina</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#161b28">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Static page, no script.js — GitHub Pages serves this file directly
       on a 404, so it can't depend on a fetch()'d data/site.json or any
       other JS-rendered content. The badge markup below is hand-written to
       match components/logo.js's own output exactly (same picture/webp/png
       sources, same onerror fallback) rather than importing it, since that
       module expects a site.json object as input. -->
  <header class="hero" id="hero" style="min-height: 100vh;">
    <div class="hero-inner">
      <div style="margin-bottom: 28px;">
        <picture>
          <source srcset="/images/logo/badge.webp" type="image/webp">
          <img
            src="/images/logo/badge.png" alt="Klandestina"
            width="256" height="256" style="height: 46px; width: auto; border-radius: 50%; display: block;"
            onerror="this.closest('picture').outerHTML='Klande&middot;stina'"
          >
        </picture>
      </div>
      <span class="eyebrow">404 — Page not found</span>
      <h1 style="font-size: clamp(48px, 10vw, 96px);">Wrong door.</h1>
      <p>That page doesn't exist — moved, renamed, or never here. The menu, gallery, and everything else still is.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="/">Home</a>
        <a class="btn btn-ghost" href="/#menu">Menu</a>
        <a class="btn btn-ghost" href="https://klandestina-konepaja.menu.sciometa.com/" target="_blank" rel="noopener noreferrer">Reserve a Table</a>
      </div>
      <p style="margin-top: 28px;"><a href="/fi/">Suomeksi &rarr;</a></p>
    </div>
  </header>
</body>
</html>
